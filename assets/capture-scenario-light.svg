<svg xmlns="http://www.w3.org/2000/svg" width="880" height="192" viewBox="0 0 880 192" role="img" aria-labelledby="capture-light-title capture-light-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="capture-light-title">Voice and meeting capture</title>
  <desc id="capture-light-desc">Press the mic or phone button to record; meetings open a live note for typing questions during the call; on stop the audio is transcribed on your Mac into a speaker-labeled dialogue and lands as a tagged note in the inbox.</desc>
  <defs>
    <marker id="cl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"/>
    </marker>
    <marker id="cl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- connectors (drawn before boxes) -->
  <line x1="200" y1="84" x2="240" y2="84" stroke="#7c3aed" stroke-width="1.2" marker-end="url(#cl-arrow-accent)"/>
  <line x1="420" y1="84" x2="460" y2="84" stroke="#57606a" stroke-width="1.2" marker-end="url(#cl-arrow)"/>
  <line x1="640" y1="84" x2="680" y2="84" stroke="#57606a" stroke-width="1.2" marker-end="url(#cl-arrow)"/>

  <!-- 1. Start -->
  <rect x="20" y="44" width="180" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="110" y="72" text-anchor="middle" font-size="14">🎙️  📞</text>
  <text x="110" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Click to start</text>
  <text x="110" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">voice note · meeting</text>

  <!-- 2. Live note (focal — the new behavior) -->
  <rect x="240" y="44" width="180" height="80" rx="8" fill="#f3eefe" stroke="#7c3aed" stroke-width="1"/>
  <text x="330" y="68" text-anchor="middle" font-size="14">📝</text>
  <text x="330" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Live note opens</text>
  <text x="330" y="102" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type questions</text>
  <text x="330" y="114" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">during the call</text>

  <!-- 3. Stop + transcribe -->
  <rect x="460" y="44" width="180" height="80" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="550" y="68" text-anchor="middle" font-size="14">⏹️</text>
  <text x="550" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Stop — transcribed</text>
  <text x="550" y="102" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">on your Mac</text>
  <text x="550" y="114" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Me: / Them: dialogue</text>

  <!-- 4. Finished note -->
  <rect x="680" y="44" width="180" height="80" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="770" y="68" text-anchor="middle" font-size="14">📥</text>
  <text x="770" y="88" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Tagged note</text>
  <text x="770" y="102" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">summarized · linked</text>
  <text x="770" y="114" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">your notes kept</text>

  <!-- caption strip -->
  <line x1="20" y1="152" x2="860" y2="152" stroke="rgba(31,35,40,0.10)" stroke-width="0.8"/>
  <text x="20" y="172" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">NOTHING UPLOADED — SPEECH-TO-TEXT RUNS LOCALLY</text>
</svg>
