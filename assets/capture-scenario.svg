<svg xmlns="http://www.w3.org/2000/svg" width="880" height="248" viewBox="0 0 880 248" role="img" aria-labelledby="nous-capture-title nous-capture-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="nous-capture-title">Voice and meeting capture</title>
  <desc id="nous-capture-desc">Press the mic or phone button to record; meetings open a live note for typing questions during the call; on stop the audio is transcribed on your Mac into a speaker-labeled dialogue and lands as a tagged note in the inbox.</desc>
  <defs>
    <pattern id="nc-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
    <marker id="nc-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
    </marker>
    <marker id="nc-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#eb6c36"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#nc-dots)" opacity="0.6"/>

  <!-- connectors (drawn before boxes) -->
  <line x1="200" y1="100" x2="240" y2="100" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nc-arrow-accent)"/>
  <line x1="420" y1="100" x2="460" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
  <line x1="640" y1="100" x2="680" y2="100" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#nc-arrow)"/>

  <!-- 1. Start — input -->
  <rect x="20" y="60" width="180" height="80" rx="6" fill="#eceef1" stroke="#7a8399" stroke-width="1"/>
  <rect x="28" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(122,131,153,0.5)" stroke-width="0.8"/>
  <text x="42" y="75" text-anchor="middle" font-size="7" fill="#7a8399" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">MIC</text>
  <text x="110" y="100" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Click to start</text>
  <text x="110" y="118" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">voice note · meeting</text>

  <!-- 2. Live note — focal -->
  <rect x="240" y="60" width="180" height="80" rx="6" fill="#fbe9df" stroke="#eb6c36" stroke-width="1"/>
  <rect x="248" y="66" width="32" height="12" rx="2" fill="transparent" stroke="rgba(235,108,54,0.5)" stroke-width="0.8"/>
  <text x="264" y="75" text-anchor="middle" font-size="7" fill="#eb6c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">NOTE</text>
  <text x="330" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Live note opens</text>
  <text x="330" y="112" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">type questions</text>
  <text x="330" y="124" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">during the call</text>

  <!-- 3. Stop + transcribe — backend -->
  <rect x="460" y="60" width="180" height="80" rx="6" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <rect x="468" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.4)" stroke-width="0.8"/>
  <text x="482" y="75" text-anchor="middle" font-size="7" fill="#2d3142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">STT</text>
  <text x="550" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Stop — transcribed</text>
  <text x="550" y="112" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">on your Mac</text>
  <text x="550" y="124" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Me: / Them: dialogue</text>

  <!-- 4. Finished note — store -->
  <rect x="680" y="60" width="180" height="80" rx="6" fill="#f0f1f3" stroke="#4f5d75" stroke-width="1"/>
  <rect x="688" y="66" width="28" height="12" rx="2" fill="transparent" stroke="rgba(79,93,117,0.4)" stroke-width="0.8"/>
  <text x="702" y="75" text-anchor="middle" font-size="7" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">OUT</text>
  <text x="770" y="96" text-anchor="middle" font-size="12" font-weight="600" fill="#2d3142">Tagged note</text>
  <text x="770" y="112" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">summarized · linked</text>
  <text x="770" y="124" text-anchor="middle" font-size="9" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">your notes kept</text>

  <!-- legend -->
  <line x1="20" y1="176" x2="860" y2="176" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
  <text x="20" y="196" font-size="8" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.14em">LEGEND</text>
  <rect x="20" y="208" width="16" height="12" rx="2" fill="#fbe9df" stroke="#eb6c36" stroke-width="1"/>
  <text x="44" y="218" font-size="9" fill="#2d3142">Focal / new behavior</text>
  <rect x="196" y="208" width="16" height="12" rx="2" fill="#ffffff" stroke="#2d3142" stroke-width="1"/>
  <text x="220" y="218" font-size="9" fill="#2d3142">Step</text>
  <rect x="304" y="208" width="16" height="12" rx="2" fill="#f0f1f3" stroke="#4f5d75" stroke-width="1"/>
  <text x="328" y="218" font-size="9" fill="#2d3142">Result</text>
  <line x1="416" y1="214" x2="448" y2="214" stroke="#eb6c36" stroke-width="1.2" marker-end="url(#nc-arrow-accent)"/>
  <text x="456" y="218" font-size="9" fill="#2d3142">Primary flow</text>
  <line x1="560" y1="214" x2="592" y2="214" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#nc-arrow)"/>
  <text x="600" y="218" font-size="9" fill="#2d3142">Flow</text>
</svg>
