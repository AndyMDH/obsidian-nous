<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="nous-demo-title nous-demo-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="nous-demo-title">Meeting capture, start to finished note</title>
  <desc id="nous-demo-desc">One recording cycle: a live note opens while recording, the user types a question under Meeting notes, recording stops, the transcript fills in as a Me and Them dialogue, and the note comes back tagged and linked.</desc>
  <defs>
    <pattern id="nd-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
  </defs>
  <style>
    /* Base state = the final frame, so reduced-motion readers see the
       finished note instead of an empty one. */
    .ph0 { opacity: 0; }
    .rec  { animation: nd-rec 8s linear infinite; }
    .trans { animation: nd-trans 8s linear infinite; }
    .done { animation: nd-done 8s linear infinite; }
    .typed1 { animation: nd-typed1 8s linear infinite; }
    .typed2 { animation: nd-typed2 8s linear infinite; }
    .typed3 { animation: nd-typed3 8s linear infinite; }
    .typed4 { animation: nd-typed4 8s linear infinite; }
    .placeholder { animation: nd-placeholder 8s linear infinite; }
    .line1 { animation: nd-line1 8s linear infinite; }
    .line2 { animation: nd-line2 8s linear infinite; }
    .line3 { animation: nd-line3 8s linear infinite; }
    .enriched { animation: nd-enriched 8s linear infinite; }
    @keyframes nd-rec { 0%, 2% { opacity: 0; } 4%, 54% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes nd-trans { 0%, 56% { opacity: 0; } 58%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes nd-done { 0%, 80% { opacity: 0; } 82%, 100% { opacity: 1; } }
    @keyframes nd-typed1 { 0%, 8% { opacity: 0; } 10%, 100% { opacity: 1; } }
    @keyframes nd-typed2 { 0%, 13% { opacity: 0; } 15%, 100% { opacity: 1; } }
    @keyframes nd-typed3 { 0%, 18% { opacity: 0; } 20%, 100% { opacity: 1; } }
    @keyframes nd-typed4 { 0%, 30% { opacity: 0; } 34%, 100% { opacity: 1; } }
    @keyframes nd-placeholder { 0%, 3% { opacity: 0; } 5%, 50% { opacity: 1; } 54%, 100% { opacity: 0; } }
    @keyframes nd-line1 { 0%, 56% { opacity: 0; } 60%, 100% { opacity: 1; } }
    @keyframes nd-line2 { 0%, 63% { opacity: 0; } 67%, 100% { opacity: 1; } }
    @keyframes nd-line3 { 0%, 70% { opacity: 0; } 74%, 100% { opacity: 1; } }
    @keyframes nd-enriched { 0%, 80% { opacity: 0; } 84%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rec, .trans, .done, .typed1, .typed2, .typed3, .typed4, .placeholder, .line1, .line2, .line3, .enriched {
        animation: none;
      }
    }
  </style>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#nd-dots)" opacity="0.6"/>

  <!-- note window -->
  <rect x="92" y="28" width="696" height="344" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="92" y1="64" x2="788" y2="64" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="46" r="5" fill="#d0d7de"/>
  <circle cx="134" cy="46" r="5" fill="#d0d7de"/>
  <circle cx="152" cy="46" r="5" fill="#d0d7de"/>
  <text x="172" y="50" font-size="11" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2026-08-15 11.30 Meeting live note.md</text>

  <!-- status pill states (top right) -->
  <g class="rec">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#EDE9E1" stroke="#4C5138" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#4C5138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">🔴 recording</text>
  </g>
  <g class="trans">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">⏳ transcribing</text>
  </g>
  <g class="done">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#EDE9E1" stroke="#4C5138" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#4C5138" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">✓ note ready</text>
  </g>

  <!-- Meeting notes section -->
  <text x="124" y="96" font-size="15" font-weight="600" fill="#4C5138">Meeting notes</text>
  <text x="124" y="124" font-size="12" fill="#2d3142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan class="typed1">- [ ] Ask about</tspan><tspan class="typed2"> the data-quality</tspan><tspan class="typed3"> SLAs</tspan></text>
  <text class="typed4 ph0" x="124" y="146" font-size="12" fill="#2d3142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">Decision: weekly sync, Tuesdays 10:00</text>

  <!-- Transcript section -->
  <text x="124" y="186" font-size="15" font-weight="600" fill="#4C5138">Transcript</text>
  <text class="placeholder ph0" x="124" y="214" font-size="12" font-style="italic" fill="#7a8399">Recording — the transcript appears here when you stop.</text>
  <text class="line1" x="124" y="214" font-size="12" fill="#2d3142"><tspan font-weight="600" fill="#4f5d75">Them:</tspan> The pipeline drops records when the source schema changes.</text>
  <text class="line2" x="124" y="238" font-size="12" fill="#2d3142"><tspan font-weight="600" fill="#4f5d75">Me:</tspan> What SLAs do we have on data quality today?</text>
  <text class="line3" x="124" y="262" font-size="12" fill="#2d3142"><tspan font-weight="600" fill="#4f5d75">Them:</tspan> None yet — let's define them this quarter.</text>

  <!-- enriched footer -->
  <g class="enriched">
    <line x1="124" y1="296" x2="756" y2="296" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="124" y="322" font-size="12" fill="#2d3142"><tspan fill="#4C5138" font-weight="600">✓</tspan> Tagged, summarized, and linked — filed in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10-Notes/</tspan></text>
    <rect x="124" y="334" width="104" height="18" rx="9" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="176" y="347" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#data-quality</text>
    <rect x="236" y="334" width="76" height="18" rx="9" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="274" y="347" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#meetings</text>
  </g>
</svg>
