<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="nous-demo-title nous-demo-desc" font-family="&#39;Hanken Grotesk&#39;, -apple-system, &#39;Segoe UI&#39;, Helvetica, Arial, sans-serif">
  <title id="nous-demo-title">Meeting capture, start to finished note</title>
  <desc id="nous-demo-desc">One recording cycle: a live note opens while recording, the user types a question under Meeting notes, recording stops, the transcript fills in as a Me and Them dialogue, and the note comes back tagged and linked.</desc>

  <style>
    .rec, .trans, .done, .typed1, .typed2, .typed3, .typed4,
    .placeholder, .line1, .line2, .line3, .enriched { opacity: 0; }

    .rec         { animation: nous-demo-rec 16s ease infinite; }
    .trans       { animation: nous-demo-trans 16s ease infinite; }
    .done        { animation: nous-demo-done 16s ease infinite; }
    .placeholder { animation: nous-demo-placeholder 16s ease infinite; }
    .typed1      { animation: nous-demo-typed1 16s steps(1) infinite; }
    .typed2      { animation: nous-demo-typed2 16s steps(1) infinite; }
    .typed3      { animation: nous-demo-typed3 16s steps(1) infinite; }
    .typed4      { animation: nous-demo-typed4 16s steps(1) infinite; }
    .line1       { animation: nous-demo-line1 16s steps(1) infinite; }
    .line2       { animation: nous-demo-line2 16s steps(1) infinite; }
    .line3       { animation: nous-demo-line3 16s steps(1) infinite; }
    .enriched    { animation: nous-demo-enriched 16s ease infinite; }

    @keyframes nous-demo-rec         { 0%, 36% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes nous-demo-trans       { 0%, 38% { opacity: 0; } 42%, 66% { opacity: 1; } 70%, 100% { opacity: 0; } }
    @keyframes nous-demo-done        { 0%, 68% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes nous-demo-placeholder { 0%, 36% { opacity: 1; } 40%, 100% { opacity: 0; } }
    @keyframes nous-demo-typed1      { 0%, 3% { opacity: 0; } 5%, 100% { opacity: 1; } }
    @keyframes nous-demo-typed2      { 0%, 8% { opacity: 0; } 10%, 100% { opacity: 1; } }
    @keyframes nous-demo-typed3      { 0%, 13% { opacity: 0; } 15%, 100% { opacity: 1; } }
    @keyframes nous-demo-typed4      { 0%, 20% { opacity: 0; } 22%, 100% { opacity: 1; } }
    @keyframes nous-demo-line1       { 0%, 43% { opacity: 0; } 46%, 100% { opacity: 1; } }
    @keyframes nous-demo-line2       { 0%, 53% { opacity: 0; } 56%, 100% { opacity: 1; } }
    @keyframes nous-demo-line3       { 0%, 61% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes nous-demo-enriched    { 0%, 74% { opacity: 0; } 78%, 100% { opacity: 1; } }

    /* Land on the finished-note state, not mid-recording, for anyone who
       prefers reduced motion. */
    @media (prefers-reduced-motion: reduce) {
      .rec, .trans, .done, .typed1, .typed2, .typed3, .typed4,
      .placeholder, .line1, .line2, .line3, .enriched { animation: none; }
      .rec, .trans, .placeholder { opacity: 0; }
      .done, .typed1, .typed2, .typed3, .typed4, .line1, .line2, .line3, .enriched { opacity: 1; }
    }
  </style>

  <rect width="100%" height="100%" fill="#F5F2ED"></rect>

  
  <rect x="92" y="24" width="696" height="352" rx="16" fill="#FFFFFF" stroke="#E7E2DA" stroke-width="1"></rect>
  <line x1="92" y1="66" x2="788" y2="66" stroke="#EBE6DE" stroke-width="1"></line>
  
  <g transform="translate(112, 34)">
    <rect width="24" height="24" rx="7" fill="#4C5138"></rect>
    <path d="M7.7 18.4 V9.9 C7.7 7.1 9.6 5.1 12 5.1 C14.6 5.1 16.7 7.1 16.7 9.9 V15 A2.1 2.1 0 0 1 12.5 15 V11.2" stroke="#F5F2ED" stroke-width="2.1" fill="none" stroke-linecap="round"></path>
  </g>
  <text x="146" y="50" font-size="11" fill="#8A857D" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2026-08-15 11.30 Meeting live note.md</text>

  
  <g class="rec">
    <rect x="640" y="36" width="126" height="22" rx="11" fill="#FFFFFF" stroke="#4C5138" stroke-width="1"></rect>
    <circle class="pulse" cx="656" cy="47" r="4" fill="#4C5138"></circle>
    <text x="668" y="51" font-size="10" fill="#4C5138" font-weight="600" letter-spacing="0.06em">RECORDING</text>
  </g>
  <g class="trans">
    <rect x="640" y="36" width="126" height="22" rx="11" fill="#EDE9E1"></rect>
    <text x="703" y="51" text-anchor="middle" font-size="10" fill="#6B6660" font-weight="600" letter-spacing="0.06em">TRANSCRIBING</text>
  </g>
  <g class="done">
    <rect x="640" y="36" width="126" height="22" rx="11" fill="#4C5138"></rect>
    <text x="703" y="51" text-anchor="middle" font-size="10" fill="#F5F2ED" font-weight="600" letter-spacing="0.06em">NOTE READY</text>
  </g>

  
  <text x="124" y="100" font-size="11" font-weight="600" fill="#A6A199" letter-spacing="0.14em">MEETING NOTES</text>
  <text x="124" y="126" font-size="13" fill="#3A3733" font-family="Georgia, serif"><tspan class="typed1">Ask about</tspan><tspan class="typed2"> the data-quality</tspan><tspan class="typed3"> SLAs</tspan></text>
  <text class="typed4 ph0" x="124" y="148" font-size="13" fill="#3A3733" font-family="Georgia, serif">Decision: weekly sync, Tuesdays 10:00</text>

  
  <text x="124" y="190" font-size="11" font-weight="600" fill="#A6A199" letter-spacing="0.14em">TRANSCRIPT</text>
  <text class="placeholder ph0" x="124" y="216" font-size="13" font-style="italic" fill="#A6A199" font-family="Georgia, serif">Recording — the transcript appears here when you stop.</text>
  <text class="line1" x="124" y="216" font-size="13" fill="#3A3733" font-family="Georgia, serif"><tspan font-weight="600" fill="#4C5138" font-family="&#39;Hanken Grotesk&#39;, -apple-system, sans-serif" font-size="12">Them</tspan>  The pipeline drops records when the source schema changes.</text>
  <text class="line2" x="124" y="240" font-size="13" fill="#3A3733" font-family="Georgia, serif"><tspan font-weight="600" fill="#4C5138" font-family="&#39;Hanken Grotesk&#39;, -apple-system, sans-serif" font-size="12">Me</tspan>  What SLAs do we have on data quality today?</text>
  <text class="line3" x="124" y="264" font-size="13" fill="#3A3733" font-family="Georgia, serif"><tspan font-weight="600" fill="#4C5138" font-family="&#39;Hanken Grotesk&#39;, -apple-system, sans-serif" font-size="12">Them</tspan>  None yet — let&#39;s define them this quarter.</text>

  
  <g class="enriched">
    <line x1="124" y1="298" x2="756" y2="298" stroke="#EBE6DE" stroke-width="1"></line>
    <path d="M126 320 L130 324 L138 315" stroke="#4C5138" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"></path>
    <text x="148" y="324" font-size="12" fill="#3A3733">Tagged, summarized, and linked — filed in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace" fill="#6B6660">10-Notes/</tspan></text>
    <rect x="124" y="336" width="96" height="20" rx="10" fill="#4C5138"></rect>
    <text x="172" y="350" text-anchor="middle" font-size="10" fill="#F5F2ED" font-weight="500">data-quality</text>
    <rect x="228" y="336" width="74" height="20" rx="10" fill="#4C5138"></rect>
    <text x="265" y="350" text-anchor="middle" font-size="10" fill="#F5F2ED" font-weight="500">meetings</text>
  </g>
</svg>