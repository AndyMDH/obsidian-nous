<svg xmlns="http://www.w3.org/2000/svg" width="880" height="400" viewBox="0 0 880 400" role="img" aria-labelledby="nous-demo-title nous-demo-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="nous-demo-title">Meeting capture, start to finished note</title>
  <desc id="nous-demo-desc">One recording cycle: a live note opens while recording, the user types a question under Meeting notes, recording stops, the transcript fills in as a Me and Them dialogue, and the note comes back tagged and linked.</desc>
  <defs>
    <pattern id="nd-dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
    </pattern>
  </defs>
  <style>
    /* Base state = the final frame, so reduced-motion readers see the
       finished note instead of an empty one. */
    .ph0 { opacity: 0; }
    .rec  { animation: nd-rec 14s linear infinite; }
    .trans { animation: nd-trans 14s linear infinite; }
    .done { animation: nd-done 14s linear infinite; }
    .typed1 { animation: nd-typed1 14s linear infinite; }
    .typed2 { animation: nd-typed2 14s linear infinite; }
    .typed3 { animation: nd-typed3 14s linear infinite; }
    .placeholder { animation: nd-placeholder 14s linear infinite; }
    .line1 { animation: nd-line1 14s linear infinite; }
    .line2 { animation: nd-line2 14s linear infinite; }
    .enriched { animation: nd-enriched 14s linear infinite; }
    @keyframes nd-rec { 0%, 2% { opacity: 0; } 4%, 54% { opacity: 1; } 56%, 100% { opacity: 0; } }
    @keyframes nd-trans { 0%, 56% { opacity: 0; } 58%, 78% { opacity: 1; } 80%, 100% { opacity: 0; } }
    @keyframes nd-done { 0%, 80% { opacity: 0; } 82%, 100% { opacity: 1; } }
    @keyframes nd-typed1 { 0%, 10% { opacity: 0; } 12%, 100% { opacity: 1; } }
    @keyframes nd-typed2 { 0%, 17% { opacity: 0; } 19%, 100% { opacity: 1; } }
    @keyframes nd-typed3 { 0%, 24% { opacity: 0; } 26%, 100% { opacity: 1; } }
    @keyframes nd-placeholder { 0%, 3% { opacity: 0; } 5%, 53% { opacity: 1; } 57%, 100% { opacity: 0; } }
    @keyframes nd-line1 { 0%, 60% { opacity: 0; } 64%, 100% { opacity: 1; } }
    @keyframes nd-line2 { 0%, 68% { opacity: 0; } 72%, 100% { opacity: 1; } }
    @keyframes nd-enriched { 0%, 82% { opacity: 0; } 86%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .rec, .trans, .done, .typed1, .typed2, .typed3, .placeholder, .line1, .line2, .enriched {
        animation: none;
      }
    }
  </style>

  <rect width="100%" height="100%" fill="#f5f5f5"/>
  <rect width="100%" height="100%" fill="url(#nd-dots)" opacity="0.6"/>

  <!-- note window -->
  <rect x="92" y="28" width="696" height="344" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <line x1="92" y1="64" x2="788" y2="64" stroke="#d0d7de" stroke-width="1"/>
  <circle cx="116" cy="46" r="5" fill="#d0d7de"/>
  <circle cx="134" cy="46" r="5" fill="#d0d7de"/>
  <circle cx="152" cy="46" r="5" fill="#d0d7de"/>
  <text x="172" y="50" font-size="11" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">2026-08-15 11.30 Meeting live note.md</text>

  <!-- status pill states (top right) -->
  <g class="rec">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#fbe9df" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#eb6c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">🔴 recording</text>
  </g>
  <g class="trans">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">⏳ transcribing</text>
  </g>
  <g class="done">
    <rect x="640" y="36" width="132" height="20" rx="10" fill="#fbe9df" stroke="#eb6c36" stroke-width="0.8"/>
    <text x="706" y="50" text-anchor="middle" font-size="10" fill="#eb6c36" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">✓ note ready</text>
  </g>

  <!-- Meeting notes section -->
  <text x="124" y="104" font-size="15" font-weight="600" fill="#eb6c36">Meeting notes</text>
  <text x="124" y="136" font-size="12.5" fill="#2d3142" font-family="ui-monospace, SFMono-Regular, Menlo, monospace"><tspan class="typed1">- [ ] Ask</tspan><tspan class="typed2"> about</tspan><tspan class="typed3"> the Q3 budget</tspan></text>

  <!-- Transcript section -->
  <text x="124" y="188" font-size="15" font-weight="600" fill="#eb6c36">Transcript</text>
  <text class="placeholder ph0" x="124" y="218" font-size="12" font-style="italic" fill="#7a8399">Recording — the transcript appears here when you stop.</text>
  <text class="line1" x="124" y="218" font-size="12.5" fill="#2d3142"><tspan font-weight="600" fill="#4f5d75">Them:</tspan> Let's start with the roadmap for next quarter.</text>
  <text class="line2" x="124" y="244" font-size="12.5" fill="#2d3142"><tspan font-weight="600" fill="#4f5d75">Me:</tspan> What is the Q3 budget for this?</text>

  <!-- enriched footer -->
  <g class="enriched">
    <line x1="124" y1="304" x2="756" y2="304" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
    <text x="124" y="332" font-size="12" fill="#2d3142"><tspan fill="#eb6c36" font-weight="600">✓</tspan> Tagged, summarized, and linked — filed in <tspan font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10-Notes/</tspan></text>
    <rect x="124" y="344" width="66" height="18" rx="9" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="157" y="357" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#budget</text>
    <rect x="198" y="344" width="76" height="18" rx="9" fill="#f0f1f3" stroke="#4f5d75" stroke-width="0.8"/>
    <text x="236" y="357" text-anchor="middle" font-size="10" fill="#4f5d75" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">#meetings</text>
  </g>
</svg>
