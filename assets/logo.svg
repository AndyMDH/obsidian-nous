<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-labelledby="nous-logo-title">
  <title id="nous-logo-title">Nous — a friendly lowercase n with a tangerine thought-spark</title>
  <rect x="4" y="4" width="104" height="104" rx="28" fill="#f5f5f5" stroke="#d5d9e0" stroke-width="2"/>
  <!-- lowercase n, one rounded ink stroke -->
  <path d="M 38 80 L 38 50 Q 38 42 48 42 L 60 42 Q 74 42 74 56 L 74 80"
        fill="none" stroke="#2d3142" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- thought-spark -->
  <circle cx="82" cy="30" r="7" fill="#eb6c36"/>
</svg>
