<svg xmlns="http://www.w3.org/2000/svg" width="112" height="112" viewBox="0 0 112 112" role="img" aria-labelledby="nous-logo-title">
  <title id="nous-logo-title">Nous — a friendly lowercase n with a thought-spark</title>
  <rect x="4" y="4" width="104" height="104" rx="28" fill="#FAF3ED" stroke="#E8D9CC" stroke-width="2"/>
  <!-- lowercase n, one warm rounded stroke -->
  <path d="M 38 80 L 38 50 Q 38 42 48 42 L 60 42 Q 74 42 74 56 L 74 80"
