<svg xmlns="http://www.w3.org/2000/svg" width="900" height="192" viewBox="0 0 900 192" role="img" aria-labelledby="pipeline-light-title pipeline-light-desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="pipeline-light-title">The Nous pipeline</title>
  <desc id="pipeline-light-desc">Anything you capture lands in the inbox, Nous enriches it into a tagged linked note, and topics with four or more notes get a self-updating wiki page.</desc>
  <defs>
    <marker id="pl-arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#57606a"/>
    </marker>
    <marker id="pl-arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#C4633B"/>
    </marker>
  </defs>

  <!-- connectors (drawn before boxes) -->
  <line x1="168" y1="84" x2="200" y2="84" stroke="#57606a" stroke-width="1.2" marker-end="url(#pl-arrow)"/>
  <line x1="340" y1="84" x2="372" y2="84" stroke="#C4633B" stroke-width="1.2" marker-end="url(#pl-arrow-accent)"/>
  <line x1="512" y1="84" x2="544" y2="84" stroke="#C4633B" stroke-width="1.2" marker-end="url(#pl-arrow-accent)"/>
  <line x1="684" y1="84" x2="716" y2="84" stroke="#57606a" stroke-width="1.2" marker-end="url(#pl-arrow)"/>

  <!-- 1. You capture -->
  <rect x="28" y="48" width="140" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="98" y="72" text-anchor="middle" font-size="14">💭 🎙️ 📞 📄</text>
  <text x="98" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">You capture</text>
  <text x="98" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">talk · paste · drop</text>

  <!-- 2. Inbox -->
  <rect x="200" y="48" width="140" height="72" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1"/>
  <text x="270" y="72" text-anchor="middle" font-size="14">📥</text>
  <text x="270" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Inbox</text>
  <text x="270" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">00-Inbox/</text>

  <!-- 3. Nous (focal) -->
  <rect x="372" y="48" width="140" height="72" rx="8" fill="#FAEEE7" stroke="#C4633B" stroke-width="1"/>
  <text x="442" y="72" text-anchor="middle" font-size="14">🧠</text>
  <text x="442" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Nous enriches</text>
  <text x="442" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">title · tags · links</text>

  <!-- 4. Linked notes -->
  <rect x="544" y="48" width="140" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="614" y="72" text-anchor="middle" font-size="14">🔗</text>
  <text x="614" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Linked notes</text>
  <text x="614" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">10-Notes/</text>

  <!-- 5. Wikis -->
  <rect x="716" y="48" width="140" height="72" rx="8" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
  <text x="786" y="72" text-anchor="middle" font-size="14">📖</text>
  <text x="786" y="92" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">Wikis</text>
  <text x="786" y="108" text-anchor="middle" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">topic ≥ 4 notes</text>

  <!-- caption strip -->
  <line x1="28" y1="148" x2="856" y2="148" stroke="rgba(31,35,40,0.10)" stroke-width="0.8"/>
  <text x="28" y="168" font-size="9" fill="#57606a" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" letter-spacing="0.08em">RUNS LIVE IN THE BACKGROUND — NO COMMAND TO RUN</text>
</svg>
